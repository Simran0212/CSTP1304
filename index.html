<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journey 🧭</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Journey 🧭</span>
    </div>
</nav>

<header class="hero">
    <div class="container text-center">
        <h1>Personalized Health Planner</h1>
        <p>Answer a few questions and receive a personalized plan.</p>
    </div>
</header>

<div class="container my-5">

    <div class="card shadow">
        <div class="card-body">

            <h2 class="mb-4">Health Questionnaire</h2>

            <form id="healthForm">

                <div class="mb-3">
                    <label class="form-label">
                        How many hours do you sleep each night?
                    </label>

                    <select class="form-select" id="sleep">
                        <option value="low">Less than 6</option>
                        <option value="normal">6-8</option>
                        <option value="high">More than 8</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        How often do you exercise?
                    </label>

                    <select class="form-select" id="exercise">
                        <option value="never">Never</option>
                        <option value="sometimes">1-2 times/week</option>
                        <option value="often">3+ times/week</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        How healthy are your eating habits?
                    </label>

                    <select class="form-select" id="diet">
                        <option value="poor">Mostly unhealthy</option>
                        <option value="average">Sometimes healthy</option>
                        <option value="good">Mostly healthy</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label">
                        What is your biggest challenge?
                    </label>

                    <select class="form-select" id="goal">
                        <option value="focus">Staying awake and focused</option>
                        <option value="weight">Losing weight</option>
                        <option value="nutrition">Eating healthier</option>
                    </select>
                </div>

                <button class="btn btn-success w-100">
                    Generate My Plan
                </button>

            </form>

        </div>
    </div>

    <div id="resultCard" class="card shadow mt-4 d-none">
        <div class="card-body">

            <h2>Your Recommended Plan</h2>

            <div id="result"></div>

            <button class="btn btn-danger mt-3" onclick="clearPlan()">
                Clear Saved Plan
            </button>

        </div>
    </div>

</div>

<footer>
    Journey
</footer>

<script src="script.js"></script>

</body>
</html>
